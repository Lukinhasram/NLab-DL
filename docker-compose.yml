# =============================================================================
# NLab-DL — Unified OLTP Source (MariaDB) + Data Lake Stack
# =============================================================================
# Arquitetura:
#   MariaDB 11 (nlab_db) -> Airflow + DuckDB -> Silo (S3: Bronze/Prata/Ouro)
#   -> Hive Metastore (MariaDB 10.5) -> Trino 380 -> Apache Superset
#
# Orçamento de memória calibrado para hosts com até 16 GB de RAM.
# =============================================================================

networks:
  lakehouse:
    driver: bridge

volumes:
  mariadb_data:
  silo_data:
  hms_mariadb_data:
  superset_data:
  postgres_airflow_data:
  airflow_logs:

services:

  # ── Fonte OLTP: nLab MariaDB 11 (preserva nome do serviço e volume) ────────
  mariadb:
    image: mariadb:11
    container_name: nlab_mariadb
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 2g
    command:
      - "--max_allowed_packet=128M"
      - "--innodb-buffer-pool-size=512M"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_PASSWORD:-senhadoida}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nlab_db}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Default: restore complete 1M-page database from dump on first startup
      - ./data/dumps/dump_completo.sql:/docker-entrypoint-initdb.d/01_dump_completo.sql:ro
      # To rebuild from scratch via the ETL pipeline instead, comment out the dump line above
      # and uncomment 01_schema.sql below:
      # - ./database/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 300s

  # ── Object Storage S3: Silo (fork open-source drop-in do MinIO) ────────────
  silo:
    image: docker.io/pgsty/silo:latest
    container_name: silo
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 1g
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-siloadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-siloadmin123}
    command: server /data --console-address ":9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || curl -sf http://localhost:9000/minio/health/live >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  silo-init:
    image: docker.io/pgsty/mc:latest
    container_name: silo-init
    networks: [lakehouse]
    depends_on:
      silo:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siloadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-siloadmin123}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://silo:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" &&
        mc mb --ignore-existing local/bronze &&
        mc mb --ignore-existing local/prata &&
        mc mb --ignore-existing local/ouro &&
        mc mb --ignore-existing local/warehouse &&
        echo 'Buckets do Data Lake prontos (bronze, prata, ouro, warehouse)'
    restart: on-failure

  # ── MariaDB 10.5 isolado para backend do Hive Metastore ────────────────────
  mariadb-metastore:
    image: mariadb:10.5
    container_name: mariadb-metastore
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 512m
    command:
      - "--innodb-buffer-pool-size=128M"
    environment:
      MYSQL_ROOT_PASSWORD: ${HMS_DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: metastore_db
      MYSQL_USER: hive
      MYSQL_PASSWORD: ${HMS_DB_PASSWORD:-hive123}
    volumes:
      - hms_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "hive", "-p${HMS_DB_PASSWORD:-hive123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Hive Metastore com S3A pré-configurado ─────────────────────────────────
  hive-metastore:
    image: bitsondatadev/hive-metastore:latest
    container_name: hive-metastore
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 1g
    depends_on:
      mariadb-metastore:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    ports:
      - "${HMS_PORT:-9083}:9083"
    environment:
      METASTORE_DB_HOSTNAME: mariadb-metastore
    volumes:
      - ./platform/hive/metastore-site.xml:/opt/apache-hive-metastore-3.0.0-bin/conf/metastore-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  # ── Trino: Query Engine distribuído (Hive/Silo + MariaDB federado) ─────────
  trino:
    image: trinodb/trino:380
    container_name: trino
    restart: on-failure
    networks: [lakehouse]
    mem_limit: 2g
    depends_on:
      hive-metastore:
        condition: service_healthy
    ports:
      - "${TRINO_PORT:-8080}:8080"
    volumes:
      - ./platform/trino/etc/config.properties:/etc/trino/config.properties:ro
      - ./platform/trino/etc/jvm.config:/etc/trino/jvm.config:ro
      - ./platform/trino/etc/node.properties:/etc/trino/node.properties:ro
      - ./platform/trino/catalog/hive.properties:/etc/trino/catalog/hive.properties:ro
      - ./platform/trino/catalog/mariadb_fonte.properties:/etc/trino/catalog/mariadb_fonte.properties:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Apache Superset: BI e Dashboards sobre o Trino ─────────────────────────
  superset:
    build:
      context: ./platform/superset
      dockerfile: Dockerfile
    image: nlab-superset-trino:latest
    container_name: superset
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 1536m
    depends_on:
      trino:
        condition: service_started
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-nlab-lakehouse-secret-2026}
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - superset_data:/app/superset_home
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@nlab-lakehouse.local --password admin || true &&
        superset init &&
        superset run -h 0.0.0.0 -p 8088
      "

  # ── PostgreSQL interno do Airflow ──────────────────────────────────────────
  postgres-airflow:
    image: postgres:15-alpine
    container_name: postgres-airflow
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 512m
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow123}
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Apache Airflow + DuckDB: Orquestração e Compute do pipeline Medallion ──
  airflow:
    build:
      context: ./platform/airflow
      dockerfile: Dockerfile
    image: nlab-airflow-lakehouse:latest
    container_name: airflow
    restart: unless-stopped
    networks: [lakehouse]
    mem_limit: 2g
    depends_on:
      postgres-airflow:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8082}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow123}@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-nlab-lakehouse-airflow-2026}
      AIRFLOW__WEBSERVER__WTF_CSRF_ENABLED: "false"
      # Fonte MariaDB (nome interno do serviço na rede lakehouse)
      MARIADB_HOST: mariadb
      MARIADB_PORT: "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE:-nlab_db}
      MARIADB_USER: ${MARIADB_USER:-root}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-senhadoida}
      # Object Storage S3 (Silo)
      S3_ENDPOINT: http://silo:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-siloadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-siloadmin123}
      # Hive Metastore & Trino
      HMS_HOST: hive-metastore
      HMS_PORT: "9083"
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      # DuckDB (limites calibrados para host 16 GB / WSL2 8 GB)
      DUCKDB_MEMORY_LIMIT: ${DUCKDB_MEMORY_LIMIT:-1000MB}
      DUCKDB_THREADS: ${DUCKDB_THREADS:-2}
      DUCKDB_TEMP_DIR: /tmp/duckdb_tmp
    volumes:
      - ./platform/dags:/opt/airflow/dags
      - ./platform/pipeline:/opt/airflow/pipeline
      - airflow_logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
